name: Checks

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches:
      - "master"
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  GO_VERSION: 1.26.3
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  test:
    name: go:test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo
          ginkgo -v -r -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  lint:
    name: go:lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  coverage:
    name: go:coverage
    runs-on: ubuntu-22.04
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
